site_name: GameDuo
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/controller-classic
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search:
      lang: pt

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - tables
  - admonition
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-toggle.js

nav:  
  - Início: index.md
  - Visão do Produto e Projeto:
      - "1. Cenário Atual do Cliente e do Negócio": visao-produto/cenario-atual.md
      - "2. Solução Proposta": visao-produto/solucao-proposta.md
      - "3. Intervenção Social": visao-produto/intervencao-social.md
      - "4. Estratégias": visao-produto/estrategias.md
      - "5. Engenharia de Requisitos": visao-produto/engenharia-requisitos.md
      - "6. Cronograma e Entregas": visao-produto/cronograma-entregas.md
      - "7. Interação entre Equipe e Cliente": visao-produto/interacao-equipe.md
      - "8. Requisitos de Software": visao-produto/requisitos-software.md
      - "11. Lições Aprendidas": visao-produto/licoes-aprendidas.md
      - "12. Referências Bibliográficas": visao-produto/referencias.md
  - Entregas:
      - "Unidade 1": entregas/unidade-1.md
      - "Unidade 2": entregas/unidade-2.md

