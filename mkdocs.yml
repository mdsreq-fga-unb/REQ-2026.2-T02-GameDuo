site_name: GameDuo
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/controller-classic
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

hooks:
  - hooks/dialog_block.py
  - hooks/autolink.py

plugins:
  - search:
      lang: pt
  # Gera as tabelas e os cards de requisitos a partir de data/*.yaml (ver main.py).
  # Só renderiza páginas com "render_macros: true" no front matter.
  - macros:
      render_by_default: false

watch:
  - data
  - main.py

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - tables
  - admonition
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/modais.css
  - stylesheets/requisitos.css

extra_javascript:
  - javascripts/sidebar-toggle.js
  - javascripts/modais.js
  - javascripts/requisitos.js

nav:
  - Início: index.md
  - Visão do Produto e Projeto:
      - "1. Cenário Atual do Cliente e do Negócio": visao-produto/1.cenario-atual.md
      - "2. Solução Proposta": visao-produto/2.solucao-proposta.md
      - "3. Intervenção Social": visao-produto/3.intervencao-social.md
      - "4. Estratégias": visao-produto/4.estrategias.md
      - "5. Engenharia de Requisitos": visao-produto/5.engenharia-requisitos.md
      - "6. Cronograma e Entregas": visao-produto/6.cronograma-entregas.md
      - "7. Interação entre Equipe e Cliente": visao-produto/7.interacao-equipe.md
      - "8. Requisitos de Software":
          - "8.1–8.2 Catálogo de Requisitos": visao-produto/8.1requisitos-software.md
          - "8.3 Rastreabilidade": visao-produto/8.3rastreabilidade.md
          - "8.4 Regras de Negócio": visao-produto/8.4regras-negocio.md
      - "9. DoR e DoD": visao-produto/9.dordod.md
      - "10. Backlog de Produto":
          - "10.1 Backlog Geral": visao-produto/10.1backlog-geral.md
          - "10.2 Priorização": visao-produto/10.2priorizacao.md
          - "10.3 MVP": visao-produto/10.3mvp.md
      - "11. Lições Aprendidas": visao-produto/11.licoes-aprendidas.md
      - "12. Referências Bibliográficas": visao-produto/12.referencias.md
  - Entregas:
      - "Unidade 1": entregas/unidade-1.md
      - "Unidade 2": entregas/unidade-2.md
      - "Ajuste e validação de requisitos": entregas/ajuste-validacao-requisitos.md
      - "Evidências": visao-produto/evidencias.md
