- id: RF09
  nome: Filtrar ofertas do catálogo
  descricao: O sistema deve permitir ao usuário buscar ofertas no catálogo, aplicando filtros de modalidade, jogo, elo, preço, idioma, disponibilidade, reputação e selo.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Um jogador procura uma sessão e usa os filtros do catálogo para encontrar o que quer. Ele pode combinar modalidade, jogo, faixa de preço, idioma, disponibilidade e nível declarado. O sistema mostra apenas as ofertas publicadas que atendem a todos os filtros escolhidos e avisa quando nenhuma oferta corresponde à busca. Filtros por reputação e selo de verificação não fazem parte do MVP.'
  origem: [CP3]
  origem_levantamento:
  - evidencia: reuniao-2
    decisao: Possibilidade de filtrar por verificação.
  priorizacao:
    moscow: Could Have
    esforco: {e: 1, c: 1, ce: 1}
  entrega:
    escopo: MVP
    jornada: Catálogo e ofertas
    iteracao: 9
    alcance_mvp: No MVP, a busca usa os filtros de modalidade, jogo, preço, idioma e disponibilidade; o elo filtrado é o declarado. Os filtros de reputação e selo dependem de RF06 e RF34, fora do recorte.
  rnfs_associados: []
  depende_de: [RF11, RF50]
- id: RF10
