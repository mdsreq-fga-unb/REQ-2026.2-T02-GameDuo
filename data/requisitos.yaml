# Fonte única dos requisitos do GameDuo.
#
# Todas as páginas que listam requisitos (catálogo, backlog, priorização, MVP,
# rastreabilidade e cronograma) são geradas a partir deste arquivo pelo
# mkdocs-macros-plugin (ver main.py). Para alterar um requisito, altere APENAS aqui.
#
# Campos dos RFs
#   id, nome               identidade estável do requisito
#   descricao              descrição atual do comportamento ("O sistema deve...")
#   narrativa_descritiva   declaração na técnica de Narrativas Descritivas, a escrever:
#     tecnica              "Texto narrativo" | "Caso de uso (breve descrição)" | "Cenário narrativo"
#     texto                a narrativa
#   origem                 características de produto (CP) — o OE vem de produto.yaml
#   priorizacao.moscow     Must Have (4) | Should Have (3) | Could Have (2) | Won't Have (1)
#   priorizacao.esforco    notas 1–4 de esforço (e), complexidade (c) e capacitação (ce);
#                          média e ET são calculados na renderização, nunca digitados
#   entrega.escopo         MVP | Backlog
#   entrega.jornada        parte da jornada do MVP que o requisito apoia
#   entrega.iteracao       iteração planejada (o status vem de cronograma.yaml)
#   rnfs_associados        vínculos RF→RNF já documentados nas regras de negócio e
#                          nos critérios dos RNFs; lista parcial, a revisar pela equipe
#
# Campos dos RNFs
#   classificacao, criterio   classificação URPS+/Sommerville e critério verificável
#   entrega.tratamento        tratamento registrado no quadro "MVP Definido"
#   entrega.iteracoes         iterações em que o RNF passa a se aplicar

