  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Para cada oferta de coaching ou duo, o prestador informa em quais dias da semana e em quais intervalos de horário pode atender. Ele pode atualizar essa agenda sempre que sua rotina mudar. Os horários informados são os únicos que o consumidor poderá contratar, e um horário já contratado deixa de aparecer em todas as ofertas do mesmo prestador.'
  origem: [CP2]
