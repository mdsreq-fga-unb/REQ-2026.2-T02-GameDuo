- id: RF16
  nome: Agendar serviço
  descricao: O sistema deve registrar automaticamente a contratação de coaching ou duo para o horário disponível selecionado pelo consumidor.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'O consumidor escolhe um horário disponível e confirma a contratação. O sistema verifica se ele está autenticado, se o horário continua livre e se há créditos disponíveis suficientes; atendidas as condições, registra a contratação sem pedir aceite do prestador, reserva o valor do serviço e informa a cada parte como entrar em contato com a outra. Se dois consumidores tentarem o mesmo horário ao mesmo tempo, apenas um consegue, e o outro é avisado de que o horário deixou de estar disponível.'
  origem: [CP3, CP5]
  origem_levantamento:
  - evidencia: reuniao-2
    decisao: Seleção de horário na agenda semanal do prestador.
  - evidencia: reuniao-3
    decisao: Contratação registrada automaticamente, sem aceite prévio.
  priorizacao:
    moscow: Must Have
    esforco: {e: 2, c: 2, ce: 2}
  entrega:
