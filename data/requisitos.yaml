  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'O prestador cria uma oferta de coaching ou duo informando jogo, modalidade, descrição, duração, preço, forma de comunicação e condições. Enquanto não publica, ele pode editar a oferta livremente; ao publicar, ela passa a aparecer no catálogo. Se depois alterar o preço, as contratações já feitas mantêm o valor combinado. Ofertas de conteúdo, com vídeos ou documentos, ficam fora do MVP.'
  origem: [CP3]
  origem_levantamento:
