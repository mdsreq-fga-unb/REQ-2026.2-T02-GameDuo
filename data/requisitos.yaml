# Fonte única dos requisitos do GameDuo.
#
# Todas as páginas que listam requisitos (catálogo, backlog, priorização, MVP,
# rastreabilidade e cronograma) são geradas a partir deste arquivo pelo
# mkdocs-macros-plugin (ver main.py). Para alterar um requisito, altere APENAS aqui.
#
# Campos dos RFs
#   id, nome               identidade estável do requisito
#   descricao              descrição atual do comportamento ("O sistema deve...")
#   narrativa_descritiva   declaração na técnica de Narrativas Descritivas, a escrever:
#     tecnica              "Texto narrativo" | "Caso de uso (breve descrição)" | "Cenário narrativo"
#     texto                a narrativa
#   origem                 características de produto (CP) — o OE vem de produto.yaml
#   origem_levantamento    opcional; lista de {evidencia, decisao}: a reunião ou validação
#                          da página Evidências (âncora reuniao-1, reuniao-2,
#                          validacao-pagamentos, reuniao-3, reuniao-4 ou reuniao-5) e a
#                          decisão ou necessidade registrada nela
#   priorizacao.moscow     Must Have (4) | Should Have (3) | Could Have (2) | Won't Have (1)
#   priorizacao.esforco    notas 1–4 de esforço (e), complexidade (c) e capacitação (ce);
#                          média e ET são calculados na renderização, nunca digitados
#   entrega.escopo         MVP | Backlog
#   entrega.jornada        parte da jornada do MVP que o requisito apoia
#   entrega.iteracao       iteração planejada (o status vem de cronograma.yaml)
#   entrega.status         opcional; quando preenchido, substitui o status da iteração.
#                          Usado quando o item não foi concluído no período da iteração
#                          planejada (Executada | Em andamento | Planejada)
#   entrega.alcance_mvp    opcional; quando preenchido, o RF está no MVP com alcance parcial
#                          ("MVP parcial") e o texto diz o que entra e o que fica de fora
#   rnfs_associados        vínculos RF→RNF já documentados nas regras de negócio e
#                          nos critérios dos RNFs; lista parcial, a revisar pela equipe
#   depende_de             RFs que precisam estar disponíveis para que o requisito
#                          funcione no fluxo do MVP (preenchido apenas nos RFs do MVP)
#
# Campos dos RNFs
#   classificacao             classificação URPS+/Sommerville
#   criterio_mvp              o que já é verificável no MVP (opcional)
#   parametro_pendente        parâmetro ainda a definir, sem valor estimado (opcional)
#   melhoria_futura           melhoria prevista para versões futuras (opcional)
#   entrega.tratamento        tratamento registrado no quadro "MVP Definido"
#   entrega.iteracoes         iterações em que o RNF passa a se aplicar
#   entrega.status            opcional; quando preenchido, substitui o status calculado
#                             a partir das iterações (Executada | Em andamento | Planejada)

rf:
- id: RF01
  nome: Cadastrar usuários
  descricao: O sistema deve permitir o cadastro de usuários com e-mail, senha e nickname público, permitindo corrigir os dados informados.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Uma pessoa que conhece o GameDuo decide criar sua conta. Ela informa um nickname, que será sua identificação pública, um e-mail e uma senha. O sistema confere se o e-mail e o nickname ainda não estão em uso e se a senha atende às regras de segurança; se algo estiver errado, indica o campo a corrigir sem perder o que já foi preenchido. Criada a conta, a mesma pessoa pode contratar serviços e, se quiser, passar a oferecê-los, sem um segundo cadastro. Depois, ela pode corrigir seus dados na área da conta.'
  origem: [CP7]
  origem_levantamento:
  - evidencia: reuniao-2
    decisao: Fluxo de cadastro mantido como apresentado; uma mesma conta contrata e presta serviços.
  priorizacao:
    moscow: Must Have
    esforco: {e: 1, c: 2, ce: 2}
  entrega:
    escopo: MVP
    jornada: Conta e acesso
    iteracao: 6
  rnfs_associados: []
  depende_de: []
- id: RF02
  nome: Autenticar usuários
  descricao: O sistema deve permitir ao usuário acessar o sistema após a validação das credenciais informadas.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Com a conta criada, o usuário informa seu e-mail e sua senha para entrar no GameDuo. Se as credenciais estiverem corretas, o sistema abre a sessão e libera as funções da conta, como contratar, ofertar serviços ou, para quem tem autorização, acessar a área administrativa. Se estiverem incorretas, o sistema informa que o acesso não foi possível, sem revelar qual dos dois dados está errado. Visitantes continuam podendo navegar pelo catálogo sem entrar, mas precisam se autenticar para contratar.'
  origem: [CP7]
  origem_levantamento:
  - evidencia: reuniao-2
    decisao: Fluxo de login mantido como apresentado.
  priorizacao:
    moscow: Must Have
    esforco: {e: 2, c: 2, ce: 2}
  entrega:
    escopo: MVP
    jornada: Conta e acesso
    iteracao: 6
  rnfs_associados: [RNF02]
  depende_de: [RF01]
- id: RF03
  nome: Recuperar senha
  descricao: O sistema deve permitir ao usuário recuperar a senha por e-mail e definir uma nova senha após validar a solicitação.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Um usuário esqueceu a senha e pede para recuperá-la informando o e-mail da conta. O sistema envia a esse e-mail um código ou link de uso único, válido por 30 minutos. Com ele, o usuário define uma nova senha, e a anterior deixa de funcionar. Se o código estiver vencido ou já tiver sido usado, o sistema recusa a troca e permite pedir um novo. A recuperação é feita apenas por e-mail.'
  origem: [CP7]
  origem_levantamento:
  - evidencia: reuniao-2
    decisao: Presente no fluxograma completo validado.
  priorizacao:
    moscow: Should Have
    esforco: {e: 2, c: 3, ce: 2}
  entrega:
    escopo: MVP
    jornada: Conta e acesso
    iteracao: 8
  rnfs_associados: []
  depende_de: [RF01]
- id: RF04
  nome: Configurar perfil de prestação
  descricao: O sistema deve permitir ao prestador configurar sua apresentação, jogos, nível declarado, modalidades, formatos de atendimento e idiomas.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Um usuário que quer oferecer coaching ou duo configura seu perfil de prestação. Ele escreve uma apresentação e informa os jogos em que atua, com o nível que declara ter em cada um, além das modalidades, dos formatos de atendimento e dos idiomas. O nível é declarado pelo próprio prestador e não é verificado pelo sistema no MVP. Ao configurar o perfil, o usuário passa a poder publicar ofertas, sem perder a possibilidade de contratar serviços como consumidor.'
  origem: [CP2]
  origem_levantamento:
  - evidencia: reuniao-2
    decisao: 'Conta única: a mesma conta pode contratar e prestar serviços.'
  priorizacao:
    moscow: Must Have
    esforco: {e: 3, c: 2, ce: 1}
  entrega:
    escopo: MVP
    jornada: Perfil de prestação
    iteracao: 6
  rnfs_associados: []
  depende_de: [RF02]
