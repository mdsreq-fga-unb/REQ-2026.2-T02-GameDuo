- id: RF18
  nome: Cancelar contratação
  descricao: O sistema deve permitir ao consumidor ou ao prestador cancelar uma contratação e consultar o resultado do cancelamento.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Antes do horário marcado, o consumidor ou o prestador pode cancelar a contratação. O sistema pede confirmação, registra o cancelamento, devolve integralmente ao consumidor os créditos reservados e libera o horário na agenda. Os dois podem consultar o resultado do cancelamento. Depois do horário marcado, não há mais cancelamento: o participante deve registrar o resultado da sessão.'
  origem: [CP5]
  origem_levantamento:
