    texto: 'O usuário abre sua carteira para entender seu dinheiro na plataforma. O sistema mostra separadamente o saldo disponível, o saldo retido em contratações e o saldo pendente. Para cada valor retido ou pendente, indica de qual contratação ele veio e, quando houver, a data prevista de liberação. Para o prestador, mostra também o que já pode ser sacado e o que ainda está em carência. Valores retidos ou pendentes nunca aparecem como disponíveis para uma nova contratação.'
  origem: [CP4]
  origem_levantamento:
  - evidencia: reuniao-1
    decisao: Apresentar ao prestador os ganhos e a disponibilidade do saldo.
  priorizacao:
    moscow: Must Have
    esforco: {e: 4, c: 4, ce: 4}
  entrega:
    escopo: MVP
    jornada: Créditos e recebimentos
    iteracao: 8
