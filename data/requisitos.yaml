rnf:
- id: RNF01
  nome: Autenticação em dois fatores
  descricao: O sistema deve exigir um segundo fator nas operações definidas pela política de autenticação, utilizando os canais previstos de e-mail e telefone.
  classificacao: 'Sommerville — requisito de produto: segurança'
  criterio: Uma operação protegida não deve ser concluída sem a validação do segundo fator.
  origem: [CP4, CP7]
  priorizacao:
    moscow: Could Have
  entrega:
    escopo: Backlog
    tratamento: Não aplicável ao recorte
- id: RNF02
  nome: Restrição de acesso
  descricao: O sistema deve restringir o acesso a dados pessoais, dados bancários, denúncias e avaliações ainda não publicadas conforme o papel do usuário e a situação do registro.
  classificacao: 'Sommerville — requisito de produto: segurança'
  criterio: Testes por papel, titularidade e situação do registro devem permitir os acessos autorizados e recusar os demais, inclusive por chamada direta à API.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Must Have
  entrega:
    escopo: MVP
    tratamento: Obrigatório
    iteracoes: [6, 7, 8, 9]
- id: RNF03
  nome: Auditabilidade administrativa e financeira
  descricao: As alterações administrativas e movimentações financeiras devem possuir registros rastreáveis de autoria, data, operação, registro afetado e resultado.
  classificacao: 'Sommerville — requisito de produto: segurança e auditabilidade'
  criterio: Cada alteração administrativa e movimentação financeira testada deve ser localizável por seu identificador e apresentar os elementos de auditoria; ações automáticas devem identificar o processo responsável.
  origem: [CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Could Have
  entrega:
    escopo: Backlog
    tratamento: Evolutivo
- id: RNF04
  nome: Configurabilidade de taxas
  descricao: As taxas, comissões e penalidades configuráveis devem poder ser alteradas pelo painel administrativo sem modificação do código-fonte.
  classificacao: URPS+ — suportabilidade
  criterio: Uma alteração autorizada pelo painel deve ser persistida e produzir efeito conforme as regras de vigência, sem edição do código-fonte.
  origem: [CP4, CP5, CP7]
  priorizacao:
    moscow: Won't Have
  entrega:
    escopo: Backlog
    tratamento: Não aplicável ao recorte
- id: RNF05
  nome: Periodicidade do cálculo de reputação
  descricao: O processamento de atualização da reputação deve ocorrer diariamente.
  classificacao: 'Sommerville — requisito organizacional: operacional'
  criterio: O histórico de processamento deve comprovar pelo menos uma atualização concluída por dia, no fuso de referência da plataforma.
  origem: [CP6]
  priorizacao:
    moscow: Won't Have
  entrega:
    escopo: Backlog
    tratamento: Não aplicável ao recorte
- id: RNF06
  nome: Tecnologias de implementação
  descricao: O sistema deve utilizar React no frontend e PHP no backend.
  classificacao: URPS+ — restrição de implementação
  criterio: A implementação deve utilizar essas tecnologias nas respectivas camadas.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Won't Have
  entrega:
    escopo: MVP
    tratamento: Obrigatório
    iteracoes: [6, 7, 8, 9]
- id: RNF07
  nome: Proteção de dados pessoais
  descricao: O tratamento de dados pessoais deve observar os requisitos aplicáveis da LGPD.
  classificacao: 'Sommerville — requisito externo: legislativo'
  criterio: O inventário de dados deve relacionar cada dado pessoal à finalidade, ao acesso e à retenção definidos; a revisão deve verificar a correspondência entre esse inventário, as interfaces e o armazenamento do sistema.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Should Have
  entrega:
    escopo: MVP
    tratamento: Obrigatório
    iteracoes: [6, 7, 8, 9]
- id: RNF08
  nome: Clareza das mensagens de validação
  descricao: As mensagens de validação devem identificar o campo ou a operação com problema e indicar como corrigir a informação, em linguagem compreensível ao usuário.
  classificacao: URPS+ — usabilidade
  criterio: Nos cenários de entrada inválida de cadastro, contratação e pagamento, a mensagem deve identificar o campo ou a operação afetada e informar a ação necessária para corrigir o problema, sem expor detalhes técnicos internos.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Should Have
  entrega:
    escopo: Backlog
    tratamento: Evolutivo
- id: RNF09
  nome: Consistência da agenda
  descricao: O sistema deve preservar a consistência dos horários reservados diante de solicitações simultâneas ou repetidas.
  classificacao: URPS+ — confiabilidade
  criterio: Tentativas simultâneas de reservar horários sobrepostos do mesmo prestador não devem produzir contratações incompatíveis; a repetição da mesma solicitação não deve criar outra reserva.
  origem: [CP2, CP3, CP5]
  priorizacao:
    moscow: Should Have
  entrega:
    escopo: MVP
    tratamento: Obrigatório
    iteracoes: [6]
- id: RNF10
  nome: Identificação do usuário logado
  descricao: O sistema deve exibir de forma visível, em todas as telas autenticadas, qual usuário está logado e seu papel (consumidor, prestador ou administração).
  classificacao: URPS+ — usabilidade
  criterio: Em qualquer tela acessada após autenticação, deve ser possível identificar o usuário logado e seu papel.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Must Have
  entrega:
    escopo: MVP
    tratamento: Obrigatório
    iteracoes: [6, 7, 8, 9]
- id: RNF11
  nome: Prevenção de ações involuntárias
  descricao: A interface deve exigir confirmação explícita antes do cancelamento de contratação, encerramento de oferta ou aplicação de sanção.
  classificacao: URPS+ — usabilidade
  criterio: Em cada uma das três ações, desistir da confirmação deve preservar o estado anterior; a ação somente deve prosseguir após confirmação explícita.
  origem: [CP3, CP5, CP6, CP7]
  priorizacao:
    moscow: Should Have
  entrega:
    escopo: MVP
    tratamento: Associado aos RFs selecionados (parcial)
    iteracoes: [7]
- id: RNF12
  nome: Consistência visual entre telas
  descricao: O sistema deve manter um padrão visual consistente de cores, tipografia, botões e espaçamentos em todas as telas, seguindo um guia de estilo definido.
  classificacao: URPS+ — usabilidade
  criterio: Nas telas de cadastro, catálogo, contratação, carteira e administração, componentes de mesma função e estado devem usar os mesmos estilos de cor, tipografia, botão e espaçamento definidos no guia de estilo.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Should Have
  entrega:
    escopo: Backlog
    tratamento: Evolutivo
- id: RNF13
  nome: Integridade financeira
  descricao: O sistema deve preservar a consistência dos saldos e lançamentos em operações financeiras simultâneas, repetidas ou interrompidas.
  classificacao: URPS+ — confiabilidade
  criterio: Repetir ou executar simultaneamente a mesma compra, confirmação de pagamento, liberação, divisão, devolução ou saque não deve duplicar débitos ou créditos nem reutilizar saldo reservado; as parcelas devem recompor o total distribuído.
  origem: [CP3, CP4, CP5, CP7]
  priorizacao:
    moscow: Must Have
  entrega:
    escopo: MVP
    tratamento: Obrigatório
    iteracoes: [7, 8, 9]
- id: RNF14
  nome: Proteção de credenciais e comunicação
  descricao: O sistema deve proteger as credenciais armazenadas e a transmissão de dados pessoais e financeiros.
  classificacao: 'Sommerville — requisito de produto: segurança'
  criterio: Senhas devem ser armazenadas com hash próprio para senhas, sem formato reversível, e não devem aparecer em logs ou respostas; interfaces e integrações que transmitam dados privados devem usar conexão criptografada.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Must Have
  entrega:
    escopo: MVP
    tratamento: Obrigatório
    iteracoes: [6, 7, 8, 9]
- id: RNF15
  nome: Tolerância a falhas de integração
  descricao: O sistema deve manter resultados consistentes e informar indisponibilidade ou falha nas integrações de jogos e pagamentos.
  classificacao: URPS+ — confiabilidade
  criterio: Simular indisponibilidade e resposta inválida não deve gerar credencial verificada, pagamento confirmado ou repasse concluído sem confirmação correspondente; repetir o processamento não deve duplicar seus efeitos.
  origem: [CP1, CP4, CP5]
  priorizacao:
    moscow: Should Have
  entrega:
    escopo: MVP
    tratamento: Associado aos RFs selecionados (parcial)
    iteracoes: [7, 9]
- id: RNF16
  nome: Responsividade de interface
  descricao: O sistema deve adaptar a exibição das telas a diferentes tamanhos de dispositivo (desktop, tablet e celular), preservando a leitura do conteúdo e o acesso a todas as funcionalidades.
  classificacao: URPS+ — usabilidade
  criterio: Nas telas de cadastro, catálogo, contratação, carteira e administração, o conteúdo deve permanecer legível e todas as funcionalidades devem permanecer acessíveis nas larguras de referência de desktop, tablet e celular, sem sobreposição, corte ou perda de acesso a elementos da interface.
  origem: [CP1, CP2, CP3, CP4, CP5, CP6, CP7]
  priorizacao:
    moscow: Must Have
  entrega:
    escopo: Backlog
    tratamento: Evolutivo
