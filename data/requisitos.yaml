- id: RF07
  nome: Consultar perfil de prestador
  descricao: O sistema deve permitir ao usuário consultar a apresentação, os jogos, as modalidades, as credenciais verificadas, a reputação e os indicadores do prestador.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Antes de contratar, o consumidor abre o perfil de um prestador para conhecê-lo. O sistema mostra a apresentação, os jogos, as modalidades e o nível que o prestador declarou. No MVP, credenciais verificadas, reputação e indicadores de atendimento ainda não existem, e o perfil deixa claro que o nível é declarado, sem comprovar a habilidade técnica do prestador.'
  origem: [CP1, CP2]
  origem_levantamento:
  - evidencia: reuniao-2
    decisao: Selo de verificação opcional e sem restrição a prestadores sem selo; no MVP o nível é declarado (RN13).
  priorizacao:
    moscow: Must Have
    esforco: {e: 3, c: 3, ce: 1}
  entrega:
    escopo: MVP
    jornada: Perfil de prestação
    iteracao: 9
