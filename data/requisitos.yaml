  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'O prestador decide parar de oferecer um serviço e encerra a oferta. O sistema pede confirmação e, confirmada a ação, retira a oferta do catálogo e de sua lista de ofertas, impedindo novas contratações por esse anúncio. As contratações feitas antes do encerramento continuam valendo, com os dados da oferta do momento em que foram contratadas, e devem ser cumpridas, salvo cancelamento.'
