  descricao: O sistema deve permitir ao prestador cadastrar e atualizar os dados bancários utilizados para recebimento.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Antes de solicitar um saque, o prestador cadastra os dados que serão usados para receber: a chave Pix e o CPF. Ele pode atualizar esses dados quando precisar. O sistema só permite pedir saque quando os dados obrigatórios estiverem completos e mostra apenas ao próprio prestador as informações cadastradas.'
  origem: [CP4]
