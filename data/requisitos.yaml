  descricao: O sistema deve permitir ao consumidor consultar os horários disponíveis do prestador em cada oferta.
  narrativa_descritiva:
    tecnica: Texto narrativo
    texto: 'Ao se interessar por uma oferta, o consumidor consulta os horários em que o prestador pode atendê-lo. O sistema mostra apenas os horários livres da agenda semanal, sem os que já foram contratados em qualquer oferta do prestador. Se não houver horários livres, o sistema informa isso para que o consumidor escolha outra data ou outra oferta.'
  origem: [CP2, CP3]
  origem_levantamento:
  - evidencia: reuniao-2
